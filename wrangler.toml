#     (ข) รวยแทร่168 ปิดไปแล้วจริง และชื่อนี้ว่าง
#   ตรวจด้วย:  npx wrangler deployments list --name ruaythear168
#   ถ้าโดเมนนี้เคย park ด้วย tools/domain-placeholder/ ชื่อต้องตรงกับที่ park ไว้เป๊ะ
#   ไม่งั้นจะได้ Worker ตัวที่สองขึ้นมาและโดเมนยังขึ้น "Coming soon" ต่อไป
# รอบรีแบรนด์นี้ **หยุดที่ build + verify ไม่มีการ deploy** ตามคำสั่ง operator
