# SITE.hostname.split(".")[0] ตรงๆ และ error ถ้าไม่ตรง)
# ⚠️ รอบนี้ name **ไม่ตรงกับชื่อแบรนด์** เพราะชื่อแบรนด์เป็นไทย: iconSlug
# จาก BRAND_NAME ได้ "168" (อักษรไทยโดน [^a-z0-9] กินทิ้ง) ส่วน name จากโดเมน
# ได้ "ruaythear168" — **name มาจากโดเมนเสมอ ไม่เคยมาจากชื่อแบรนด์**
#
# 🚨🚨 **หยุดอ่านตรงนี้ก่อน deploy — รอบนี้ชื่อ worker ชนกับแบรนด์เก่า** 🚨🚨
# "ruaythear168" เป็นชื่อที่ **รวยแทร่168** ใช้อยู่ (และ "ruaythear168-vip" เป็นของ
