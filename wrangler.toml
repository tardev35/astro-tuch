# ก่อนหน้าที่เป็น ASCII ล้วน) จึงต้อง **แปลง punycode ก่อน**:
#   โบ๊ะบ๊ะ-168.com -> xn---168-phoa7mb2n5cc.com -> name = "xn---168-phoa7mb2n5cc"
# ⚠️ สังเกตว่ามีขีดกลาง **สามตัวติดกัน** หลัง xn (xn + "---") เพราะ host เดิมมี
# ขีดกลางของตัวเองอยู่แล้ว (โบ๊ะบ๊ะ-168) — ห้ามลดเหลือสองขีด
# ⚠️ name คือส่วนแรกของ host เท่านั้น ไม่รวม TLD (verify-build.mjs เทียบกับ
# SITE.hostname.split(".")[0] ตรงๆ และ error ถ้าไม่ตรง)
# ⚠️ รอบนี้ name **ไม่ตรงกับชื่อแบรนด์** เพราะชื่อแบรนด์เป็นไทยผสมเลข: iconSlug
# จาก BRAND_NAME ได้ "168" (อักษรไทยโดน [^a-z0-9] กินทิ้ง เหลือแต่ตัวเลข)
# ส่วน name จากโดเมนได้ "xn---168-phoa7mb2n5cc"
# — **name มาจากโดเมนเสมอ ไม่เคยมาจากชื่อแบรนด์**
#
# 🚨🚨 **รอบนี้ชื่อ worker ชนกับของเดิมได้ง่ายที่สุดในบรรดาทุกรอบ** ในลิสต์ด้านล่าง
# มี **xn---168-pho7byc9c** (สบาย168) ซึ่ง **ขึ้นต้น 12 ตัวแรกเหมือนกันเป๊ะ**
# (`xn---168-pho`) ของรอบนี้ลงท้ายด้วย **a7mb2n5cc** ไม่ใช่ **7byc9c**
# ตรวจทีละตัวอักษรก่อน deploy ทุกครั้ง — ชื่ออื่นที่ขึ้นต้น xn-- ในลิสต์ก็ต้อง
# เทียบทั้งสตริงเช่นกัน ไม่ใช่ดูแค่ว่า "ขึ้นต้น xn-- เหมือนกัน"
#
# ก่อน deploy ให้ยืนยันว่าชื่อนี้ว่างจริงด้วย:
#   npx wrangler deployments list --name xn---168-phoa7mb2n5cc
# ถ้าโดเมนนี้เคย park ด้วย tools/domain-placeholder/ ชื่อต้องตรงกับที่ park ไว้เป๊ะ
# ไม่งั้นจะได้ Worker ตัวที่สองขึ้นมาและโดเมนยังขึ้น "Coming soon" ต่อไป
# รอบรีแบรนด์นี้ (โบ๊ะบ๊ะ168) **หยุดที่ build + verify ไม่มีการ deploy** ตามคำสั่ง operator
