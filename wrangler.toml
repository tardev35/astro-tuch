# ชื่อนี้คือ "ตัวตนของ deployment" ไม่ใช่แค่ป้ายชื่อ — deploy ด้วยชื่อที่เป็นของ
# แบรนด์อื่นจะทับ Worker ของแบรนด์นั้นทันทีโดยไม่มี error และเว็บเดิมหายไปเลย
# รอบนี้แบรนด์คือ หวยเฮง24 โดเมน huayheng-24.co — ชื่อแบรนด์เป็นภาษาไทย แต่ชื่อ
# Worker ต้องเป็น ASCII จึงใช้ label ของโดเมนตรงๆ คือ "huayheng-24" (ไม่ใช่คำ
# ทับศัพท์อื่นอย่าง "huayheng24" หรือ "huay-heng-24" เพราะรอบหน้าจะเดาไม่ถูกว่า
# อันไหนของจริง — ยึด label ของโดเมนเสมอ)
# ไม่ตัดเหลือ "huay" หรือ "huayheng" เด็ดขาด: กว้างเกินไปและพอร์ตนี้มีแบรนด์หวย
# หลายตัว
# ชื่อที่เคยใช้ไปแล้วและห้ามซ้ำ: bravos168 (BRAVO168) · ck268 (CK268) ·
# got777 (GOT777) · huay-lottoplus (LOTTOPLUS) · win-999 (WIN999) ·
# huayteng (หวยเต็ง — แบรนด์รอบก่อนหน้ารอบนี้)
# — deploy ทับแปลว่าเว็บของแบรนด์นั้นหายไปทันทีโดยไม่มี error
#
# ⚠️ ถ้าโดเมนนี้เคยถูก park ด้วยหน้า placeholder (tools/domain-placeholder/) มาก่อน
# ชื่อต้องตรงกับ Worker ที่ park ไว้เป๊ะๆ ไม่งั้นจะได้ Worker ตัวที่สองขึ้นมา
# ส่วนโดเมนยังขึ้น "Coming soon" ต่อไปโดยไม่มีอะไรฟ้อง — ตรวจก่อน deploy ด้วย
# npx wrangler deployments list --name huayheng-24
name = "huayheng-24"
account_id = "f3f61663a636fa63fa3701520c7e3c54"
compatibility_date = "2026-07-27"

# Worker ที่ทำ 301 www -> non-www ก่อนส่งต่อให้ไฟล์ static (ดู worker/index.js)
main = "worker/index.js"

workers_dev = false

[assets]
directory = "dist"
not_found_handling = "404-page"
# binding นี้คือสิ่งที่ทำให้ worker เรียก env.ASSETS.fetch() ส่งต่อไปหาไฟล์ได้
binding = "ASSETS"
