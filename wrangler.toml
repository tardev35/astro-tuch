# verify-build.mjs บังคับให้ name ตรงกับ label ของโดเมน จึงไม่มีค่าอื่นที่ build ผ่าน
# → **ห้ามรัน `wrangler deploy` จนกว่า operator จะยืนยันข้อใดข้อหนึ่ง**:
