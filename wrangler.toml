# ชื่อนี้คือ "ตัวตนของ deployment" ไม่ใช่แค่ป้ายชื่อ — deploy ด้วยชื่อที่เป็นของ
# แบรนด์อื่นจะทับ Worker ของแบรนด์นั้นทันทีโดยไม่มี error และเว็บเดิมหายไปเลย
# รอบนี้แบรนด์คือ UFA324 บนโดเมน ufa-324.org — ทั้งชื่อแบรนด์และ
# โดเมนเป็น ASCII ล้วน label จึงมาจากโดเมนตรงตัวเป็น "ufa-324" (ตัด .org ทิ้ง)
# ไม่ต้องแปลง punycode แบบรอบ หวยดีใจ / หวยคิง
#
# ชื่อที่เป็นของแบรนด์ "อื่น" และห้ามซ้ำ: bravos168 (BRAVO168) · ck268 (CK268) ·
# got777 (GOT777) · huay-lottoplus (LOTTOPLUS) · win-999 (WIN999) ·
# huayteng (หวยเต็ง) · huayheng-24 (หวยเฮง24) · huayheng-789 (หวยเฮง789) ·
# naza-99 (NAZA99) · nato-168 (NATO168) · 365-lotto (หวย365) ·
# 1ss365-a1 (1SS365) · dm899bet (DM899) · up555bet (UP555) ·
# xn----0wfj9hyax1e (หวยคิง) · huay24 (หวย24) · xn--82cx5btt7d4e (หวยดีใจ) ·
# hi59 (HI59) · boom-369 (BOOM369) · uok-365 (UOK365) ·
# gucci168-play (GUCCI168) · 789betting-th (789BETTING) ·
# takdee168-vip (แตกดี168) · koon234-play (KOON234) · pigpg-new (PIGPG) ·
# weplay168-new (WEPLAY168) · kingkong555-new (KINGKONG555) ·
# superslot-club (SUPERSLOTCLUB) · flash877-slot (FLASH877) ·
# naza168-slot (NAZA168) · duck16-88 (DUCK1688) ·
# fah999-game (FAH999 — แบรนด์รอบก่อนหน้ารอบนี้)
# — deploy ทับแปลว่าเว็บของแบรนด์นั้นหายไปทันทีโดยไม่มี error
# "ufa-324" ไม่ชนกับรายชื่อข้างบน
# ⚠️ ชื่อนี้ **มีขีดคั่น** เป็น "ufa-324" ตามโดเมนจริง ไม่ใช่ "ufa324" ติดกันแบบชื่อ
# แบรนด์ และไม่มีท้ายชื่อแบบ -new / -play / -vip / -slot / -game ที่แบรนด์อื่นใช้
# — label มาจากโดเมนตรงตัว (ตัด .org) ไม่ใช่จากชื่อแบรนด์
#
# ⚠️ ถ้าโดเมนนี้เคยถูก park ด้วยหน้า placeholder (tools/domain-placeholder/) มาก่อน
# ชื่อต้องตรงกับ Worker ที่ park ไว้เป๊ะๆ ไม่งั้นจะได้ Worker ตัวที่สองขึ้นมา
# ส่วนโดเมนยังขึ้น "Coming soon" ต่อไปโดยไม่มีอะไรฟ้อง — ตรวจก่อน deploy ด้วย
# npx wrangler deployments list --name ufa-324
name = "ufa-324"
account_id = "f3f61663a636fa63fa3701520c7e3c54"
compatibility_date = "2026-07-27"

# Worker ที่ทำ 301 www -> non-www ก่อนส่งต่อให้ไฟล์ static (ดู worker/index.js)
main = "worker/index.js"

workers_dev = false

[assets]
directory = "dist"
not_found_handling = "404-page"
# binding นี้คือสิ่งที่ทำให้ worker เรียก env.ASSETS.fetch() ส่งต่อไปหาไฟล์ได้
binding = "ASSETS"
